name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check all scripts
        run: |
          node --check scripts/read-transcript.mjs
          node --check scripts/analyze.mjs
          node --check scripts/explain.mjs
          node --check scripts/speak.mjs
      - name: Run tests
        run: node --test
